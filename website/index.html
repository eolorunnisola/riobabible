<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rioba — Download the app</title>
    <meta
      name="description"
      content="Download Rioba — gentle, Scripture-centered guidance for everyday life."
    />
    <link rel="canonical" href="https://www.riobabible.co" />
    <link rel="stylesheet" href="/signup.css" />
  </head>
  <body>
    <main class="signup-page">
      <div class="hero-visual" aria-hidden="false">
        <img
          class="logo"
          src="/assets/logo.jpg"
          width="80"
          height="80"
          alt="Rioba"
        />
        <div class="scripture-rotator" aria-live="polite" aria-atomic="true">
          <p class="scripture active"></p>
          <p class="scripture"></p>
        </div>
      </div>

      <div class="signup-card">
        <h1>Welcome to Rioba</h1>
        <p class="lead">
          Gentle, Scripture-centered guidance for what you&rsquo;re carrying. Download the app and
          start your journey today.
        </p>
        <a
          class="submit-btn store-btn"
          href="https://apps.apple.com/app/id6775082834"
          rel="noopener noreferrer"
        >
          Download on the App Store
        </a>
        <p class="legal-note">
          By downloading, you agree to our
          <a href="/privacy">Privacy Policy</a>.
        </p>
      </div>
    </main>
    <footer class="site-footer">
      <p>&copy; 2026 Rioba</p>
    </footer>
    <script src="/landing.js" defer></script>
  </body>
</html>
